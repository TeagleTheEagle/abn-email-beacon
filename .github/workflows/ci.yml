name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      # Placeholder values so the Supabase client imports cleanly during typecheck and tests.
      # Real values stay in .env locally and in Lovable Cloud; CI never touches production data.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      VITE_SUPABASE_PROJECT_ID: placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
