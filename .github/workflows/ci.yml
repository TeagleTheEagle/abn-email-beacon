name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      # Placeholder values so the Supabase client imports cleanly during typecheck and tests.
      # Real values stay in .env locally and in Lovable Cloud; CI never touches production data.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      VITE_SUPABASE_PROJECT_ID: placeholder

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Install from bun.lock, the same lockfile Lovable uses. bun.lock and the 24h
      # minimumReleaseAge guard in bunfig.toml both need Bun 1.3 or newer.
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tests
        run: bun run test
